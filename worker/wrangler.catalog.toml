name = "docs-library"
main = ".wrangler/build/index.js"
compatibility_date = "2024-12-01"

[build]
command = "node scripts/build.mjs"

[vars]
APP_ROLE = "catalog"
PUBLIC_DOCS_ORIGIN = "https://docs.shadowfax92.workers.dev"
CATALOG_ORIGIN = "https://docs-library.shadowfax92.workers.dev"

[[r2_buckets]]
binding = "DOCS_BUCKET"
bucket_name = "docs-cli"

# Only the mediator provisions these on this role; no bearer AUTH_TOKEN belongs here:
# npx wrangler secret put ALL_DOCS_PASSWORD --config wrangler.catalog.toml
# npx wrangler secret put CATALOG_SESSION_KEY --config wrangler.catalog.toml
